name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.8.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # The scratch-core tests need hc, which the runner lacks: they skip.
      - run: dart test
