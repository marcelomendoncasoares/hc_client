name: Publish to pub.dev

on:
  workflow_dispatch:
  push:
    tags:
      # Matches tags like `v0.2.1` and `v1.0.0-rc.1`: pub.dev's automated
      # publishing takes `v{{version}}`.
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # setup-dart also configures OIDC authentication for pub.dev.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Install dependencies
        run: dart pub get

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force
